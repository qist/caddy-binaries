name: Auto Build Caddy with L4 Plugin

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨检查
  workflow_call:
    inputs:
      caddy_tag:
        required: false
        type: string
        default: 'latest'
  workflow_dispatch:
    inputs:
      caddy_tag:
        description: 'Caddy version tag (e.g., v2.9.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  check-version:
    name: Check for new Caddy version
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.check.outputs.build_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Caddy version
        id: get-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_TAG="${{ inputs.caddy_tag }}"
          if [ "$INPUT_TAG" = "latest" ] || [ -z "$INPUT_TAG" ]; then
            # 使用 gh CLI 获取最新 release tag（带认证，避免 API 速率限制）
            TAG=$(gh release view --repo caddyserver/caddy --json tagName -q '.tagName' 2>/dev/null || \
              curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/caddyserver/caddy/releases/latest \
                | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          else
            TAG="$INPUT_TAG"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: Failed to determine Caddy version"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Caddy version: $TAG"

      - name: Check if already built
        id: check
        run: |
          TAG=${{ steps.get-version.outputs.tag }}

          if git tag | grep -q "^${TAG}$"; then
            echo "Tag $TAG already exists, skipping build"
            echo "build_tag=$TAG" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New version $TAG found, starting build"
            echo "build_tag=$TAG" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Caddy ${{ needs.check-version.outputs.build_tag }} ${{ matrix.suffix }}
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            goarch: amd64
            goos: linux
            suffix: linux_amd64
            ext: ''
            archive: tar.gz
          # Linux ARM64
          - os: linux
            arch: arm64
            goarch: arm64
            goos: linux
            suffix: linux_arm64
            ext: ''
            archive: tar.gz
          # Linux ARMv7
          - os: linux
            arch: armv7
            goarch: arm
            goarm: 7
            goos: linux
            suffix: linux_armv7
            ext: ''
            archive: tar.gz
          # Windows AMD64
          - os: windows
            arch: amd64
            goarch: amd64
            goos: windows
            suffix: windows_amd64
            ext: '.exe'
            archive: zip
          # Windows ARM64
          - os: windows
            arch: arm64
            goarch: arm64
            goos: windows
            suffix: windows_arm64
            ext: '.exe'
            archive: zip
          # macOS AMD64
          - os: darwin
            arch: amd64
            goarch: amd64
            goos: darwin
            suffix: darwin_amd64
            ext: ''
            archive: tar.gz
          # macOS ARM64 (Apple Silicon)
          - os: darwin
            arch: arm64
            goarch: arm64
            goos: darwin
            suffix: darwin_arm64
            ext: ''
            archive: tar.gz
          # FreeBSD AMD64
          - os: freebsd
            arch: amd64
            goarch: amd64
            goos: freebsd
            suffix: freebsd_amd64
            ext: ''
            archive: tar.gz
          # FreeBSD ARM64
          - os: freebsd
            arch: arm64
            goarch: arm64
            goos: freebsd
            suffix: freebsd_arm64
            ext: ''
            archive: tar.gz

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Install xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with L4 plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          GOCACHE: /tmp/go-build
          GOMODCACHE: /tmp/go-mod
        run: |
          # 清除 Go module 缓存，确保拉取最新插件代码
          go clean -modcache

          mkdir -p build
          OUTPUT="build/caddy${{ matrix.ext }}"

          # Build with caddy-l4 and caddyguard plugins - fully static compilation
          # 使用 --nobuild-cache 禁用 xcaddy 缓存，强制重新拉取最新代码
          xcaddy build ${{ needs.check-version.outputs.build_tag }} \
            --with github.com/mholt/caddy-l4 \
            --with github.com/qist/caddyguard \
            --output $OUTPUT

          # Verify build - check for dynamic dependencies
          ls -lh $OUTPUT
          if [ "${{ matrix.os }}" = "linux" ]; then
            ldd $OUTPUT 2>/dev/null || echo "Static binary (no ldd output expected)"
          fi

      - name: Fetch caddyguard rule-config
        run: |
          # 浅克隆 caddyguard 仓库，获取最新规则配置文件
          git clone --depth=1 https://github.com/qist/caddyguard.git /tmp/caddyguard
          cp -r /tmp/caddyguard/rule-config build/caddyguard
          rm -rf /tmp/caddyguard
          echo "Rule config files:"
          ls -la build/caddyguard/

      - name: Create archive
        run: |
          TAG="${{ needs.check-version.outputs.build_tag }}"
          cd build

          BINARY="caddy${{ matrix.ext }}"

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czvf "caddy_${TAG}_${{ matrix.suffix }}.tar.gz" "$BINARY" caddyguard/
          else
            zip -r "caddy_${TAG}_${{ matrix.suffix }}.zip" "$BINARY" caddyguard/
          fi

          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ matrix.suffix }}
          path: build/caddy_*_${{ matrix.suffix }}.*
          retention-days: 1

  release:
    name: Create Release
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: caddy-*

      - name: Prepare release files
        run: |
          mkdir -p release

          TAG="${{ needs.check-version.outputs.build_tag }}"

          # Move and rename artifacts
          for dir in artifacts/caddy-*; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  cp "$file" release/
                fi
              done
            fi
          done

          # Create SHA256 checksum file
          cd release
          sha256sum * > caddy_${TAG}_checksums.txt

          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.build_tag }}
          name: Caddy ${{ needs.check-version.outputs.build_tag }} with L4 Plugin
          body: |
            Caddy ${{ needs.check-version.outputs.build_tag }} built with [caddy-l4](https://github.com/mholt/caddy-l4) and [caddyguard](https://github.com/qist/caddyguard) plugin support.

            ## Included Plugins
            - **caddy-l4** — Layer 4 TCP/UDP proxy
            - **caddyguard** — Security/WAF module

            ## Included Platforms
            - Linux (amd64, arm64, armv7)
            - Windows (amd64, arm64)
            - macOS (amd64, arm64)
            - FreeBSD (amd64, arm64)

            ## Checksums
            SHA256 checksums are provided in `caddy_${{ needs.check-version.outputs.build_tag }}_checksums.txt`.

            ## Usage
            The L4 (Layer 4) app allows Caddy to proxy raw TCP/UDP connections.
            See [caddy-l4 documentation](https://github.com/mholt/caddy-l4) for configuration examples.

            ## File Naming
            ```
            caddy_<version>_<os>_<arch>.tar.gz  (Linux/macOS/FreeBSD)
            caddy_<version>_<os>_<arch>.zip      (Windows)
            ```
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
