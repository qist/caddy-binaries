name: Auto Build Caddy with L4 Plugin

on:
  schedule:
    - cron: '0 0 * * *'  # 每天凌晨检查
  workflow_call:
    inputs:
      caddy_tag:
        required: false
        type: string
        default: 'latest'
  workflow_dispatch:
    inputs:
      caddy_tag:
        description: 'Caddy version tag (e.g., v2.9.0)'
        required: false
        default: 'latest'
      force_build:
        description: 'Force rebuild even if the tag already exists (插件更新后重新打包时使用)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check for new Caddy version
    runs-on: ubuntu-latest
    outputs:
      build_tag: ${{ steps.check.outputs.build_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
      caddyguard_sha: ${{ steps.plugins.outputs.caddyguard_sha }}
      l4_sha: ${{ steps.plugins.outputs.l4_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Caddy version
        id: get-version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_TAG="${{ inputs.caddy_tag }}"
          if [ "$INPUT_TAG" = "latest" ] || [ -z "$INPUT_TAG" ]; then
            # 使用 gh CLI 获取最新 release tag（带认证，避免 API 速率限制）
            TAG=$(gh release view --repo caddyserver/caddy --json tagName -q '.tagName' 2>/dev/null || \
              curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/caddyserver/caddy/releases/latest \
                | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          else
            TAG="$INPUT_TAG"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "Error: Failed to determine Caddy version"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Caddy version: $TAG"

      - name: Resolve plugin commits
        id: plugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 在 check 阶段解析一次插件最新 commit，所有矩阵任务共用同一个 SHA，
          # 避免 xcaddy 解析 @latest 时命中 module proxy / runner 缓存拿到旧代码。
          CG_SHA=$(gh api repos/qist/caddyguard/commits/main --jq .sha)
          L4_SHA=$(gh api repos/mholt/caddy-l4/commits/master --jq .sha)

          if [ -z "$CG_SHA" ] || [ "$CG_SHA" = "null" ] || [ -z "$L4_SHA" ] || [ "$L4_SHA" = "null" ]; then
            echo "Error: Failed to resolve plugin commits"
            exit 1
          fi

          echo "caddyguard_sha=$CG_SHA" >> $GITHUB_OUTPUT
          echo "l4_sha=$L4_SHA" >> $GITHUB_OUTPUT
          echo "caddyguard commit: $CG_SHA"
          echo "caddy-l4   commit: $L4_SHA"

      - name: Check if already built
        id: check
        run: |
          TAG=${{ steps.get-version.outputs.tag }}
          FORCE="${{ inputs.force_build }}"

          if git tag | grep -q "^${TAG}$" && [ "$FORCE" != "true" ]; then
            echo "Tag $TAG already exists, skipping build"
            echo "build_tag=$TAG" >> $GITHUB_OUTPUT
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            if [ "$FORCE" = "true" ]; then
              echo "Force rebuild requested for existing tag $TAG"
            else
              echo "New version $TAG found, starting build"
            fi
            echo "build_tag=$TAG" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Caddy ${{ needs.check-version.outputs.build_tag }} ${{ matrix.suffix }}
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux AMD64
          - os: linux
            arch: amd64
            goarch: amd64
            goos: linux
            suffix: linux_amd64
            ext: ''
            archive: tar.gz
          # Linux ARM64
          - os: linux
            arch: arm64
            goarch: arm64
            goos: linux
            suffix: linux_arm64
            ext: ''
            archive: tar.gz
          # Linux ARMv7
          - os: linux
            arch: armv7
            goarch: arm
            goarm: 7
            goos: linux
            suffix: linux_armv7
            ext: ''
            archive: tar.gz
          # Windows AMD64
          - os: windows
            arch: amd64
            goarch: amd64
            goos: windows
            suffix: windows_amd64
            ext: '.exe'
            archive: zip
          # Windows ARM64
          - os: windows
            arch: arm64
            goarch: arm64
            goos: windows
            suffix: windows_arm64
            ext: '.exe'
            archive: zip
          # macOS AMD64
          - os: darwin
            arch: amd64
            goarch: amd64
            goos: darwin
            suffix: darwin_amd64
            ext: ''
            archive: tar.gz
          # macOS ARM64 (Apple Silicon)
          - os: darwin
            arch: arm64
            goarch: arm64
            goos: darwin
            suffix: darwin_arm64
            ext: ''
            archive: tar.gz
          # FreeBSD AMD64
          - os: freebsd
            arch: amd64
            goarch: amd64
            goos: freebsd
            suffix: freebsd_amd64
            ext: ''
            archive: tar.gz
          # FreeBSD ARM64
          - os: freebsd
            arch: arm64
            goarch: arm64
            goos: freebsd
            suffix: freebsd_arm64
            ext: ''
            archive: tar.gz

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Install xcaddy
        run: |
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build Caddy with L4 plugin
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          # 注意：不能全局 GOSUMDB=off，否则官方 toolchain(golang.org/toolchain)
          # 下载后也无法校验而 FATAL。仅对插件仓库豁免 sumdb 校验。
          GONOSUMDB: github.com/qist/caddyguard,github.com/mholt/caddy-l4
          # 插件走 git 直连，绕过 module proxy 的 @latest 缓存；其余依赖仍走代理保持速度
          GONOPROXY: github.com/qist/caddyguard,github.com/mholt/caddy-l4
        run: |
          mkdir -p build
          OUTPUT="build/caddy${{ matrix.ext }}"

          # 插件固定到 check 阶段解析出的 commit（pseudo-version 不可变，模块缓存不会导致旧代码），
          # 不再使用不带版本的 --with（那会解析 @latest，命中 proxy/runner 缓存时拿到旧 commit）
          xcaddy build ${{ needs.check-version.outputs.build_tag }} \
            --with github.com/mholt/caddy-l4@${{ needs.check-version.outputs.l4_sha }} \
            --with github.com/qist/caddyguard@${{ needs.check-version.outputs.caddyguard_sha }} \
            --output $OUTPUT

          # Verify build - check for dynamic dependencies
          ls -lh $OUTPUT
          if [ "${{ matrix.os }}" = "linux" ]; then
            ldd $OUTPUT 2>/dev/null || echo "Static binary (no ldd output expected)"
          fi

      - name: Verify plugin commits embedded in binary
        run: |
          OUTPUT="build/caddy${{ matrix.ext }}"
          CG_SHORT=$(echo "${{ needs.check-version.outputs.caddyguard_sha }}" | cut -c1-12)

          INFO=$(go version -m "$OUTPUT")
          echo "$INFO" | grep -E "github.com/(qist/caddyguard|mholt/caddy-l4)" || true

          # caddyguard 无 tag，pseudo-version 末尾带 12 位 commit 哈希，可直接核对；
          # caddy-l4 若 pin 到已打 tag 的 commit，build-info 会显示 tag 而非哈希，故只打印不校验
          echo "$INFO" | grep "github.com/qist/caddyguard" | grep -q "$CG_SHORT" \
            || { echo "ERROR: 打包产物里的 caddyguard 不是预期 commit（期望 ...$CG_SHORT），疑似缓存导致，终止发布"; exit 1; }

      - name: Fetch rule-config from nginxguard and generate caddyguard config
        run: |
          # 浅克隆 nginxguard 仓库，规则文件更完整且与 caddyguard 格式兼容
          git clone --depth=1 https://github.com/qist/nginxguard.git /tmp/nginxguard
          mkdir -p build/caddyguard
          cp -r /tmp/nginxguard/rule-config/* build/caddyguard/
          rm -rf /tmp/nginxguard

          # 生成 caddyguard 格式的 config.json（nginxguard 用 config.lua，caddyguard 用 config.json）
          cat > build/caddyguard/config.json << 'EOF'
          {
              "waf_enable": "on",
              "trust_proxy_headers": "on",
              "log_dir": "/var/log/caddyguard",
              "white_url_check": "on",
              "white_ip_check": "on",
              "white_ua_check": "on",
              "black_ip_check": "on",
              "url_check": "on",
              "url_args_check": "on",
              "user_agent_check": "on",
              "header_check": "on",
              "cookie_check": "on",
              "cc_check": "on",
              "cc_rate": "150/60",
              "cc_block_ttl": 600,
              "post_check": "on",
              "referer_check": "off",
              "file_upload_check": "on",
              "bodyless": "on",
              "multipart_streaming_check": "off",
              "upload_filename_scan_limit": 0,
              "post_body_scan_limit": 2097152,
              "waf_output": "html",
              "waf_redirect_url": "https://www.caddyguard.com"
          }
          EOF

          # 去掉 heredoc 生成的前导空格
          sed -i 's/^          //' build/caddyguard/config.json

          # 更新 domain.json 注释为 caddyguard 适用的说明
          sed -i 's|config.lua|config.json|g; s|NginxGuard|CaddyGuard|g' build/caddyguard/domain.json 2>/dev/null || true

          echo "Rule config files (from nginxguard + generated config.json):"
          ls -la build/caddyguard/

      - name: Create archive
        run: |
          TAG="${{ needs.check-version.outputs.build_tag }}"
          cd build

          BINARY="caddy${{ matrix.ext }}"

          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -czvf "caddy_${TAG}_${{ matrix.suffix }}.tar.gz" "$BINARY" caddyguard/
          else
            zip -r "caddy_${TAG}_${{ matrix.suffix }}.zip" "$BINARY" caddyguard/
          fi

          ls -lh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-${{ matrix.suffix }}
          path: build/caddy_*_${{ matrix.suffix }}.*
          retention-days: 1

  release:
    name: Create Release
    needs: [check-version, build]
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: caddy-*

      - name: Prepare release files
        run: |
          mkdir -p release

          TAG="${{ needs.check-version.outputs.build_tag }}"

          # Move and rename artifacts
          for dir in artifacts/caddy-*; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                if [ -f "$file" ]; then
                  cp "$file" release/
                fi
              done
            fi
          done

          # Create SHA256 checksum file
          cd release
          sha256sum * > caddy_${TAG}_checksums.txt

          ls -lh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.build_tag }}
          name: Caddy ${{ needs.check-version.outputs.build_tag }} with L4 Plugin
          body: |
            Caddy ${{ needs.check-version.outputs.build_tag }} built with [caddy-l4](https://github.com/mholt/caddy-l4) and [caddyguard](https://github.com/qist/caddyguard) plugin support.

            ## Included Plugins
            - **caddy-l4** — Layer 4 TCP/UDP proxy (`${{ needs.check-version.outputs.l4_sha }}`)
            - **caddyguard** — Security/WAF module (`${{ needs.check-version.outputs.caddyguard_sha }}`)

            > 插件已固定到上述 commit 构建（不再解析 `@latest`），可用 `go version -m caddy | grep caddyguard` 核对实际打包的 commit。

            ## Included Platforms
            - Linux (amd64, arm64, armv7)
            - Windows (amd64, arm64)
            - macOS (amd64, arm64)
            - FreeBSD (amd64, arm64)

            ## Checksums
            SHA256 checksums are provided in `caddy_${{ needs.check-version.outputs.build_tag }}_checksums.txt`.

            ## Usage
            The L4 (Layer 4) app allows Caddy to proxy raw TCP/UDP connections.
            See [caddy-l4 documentation](https://github.com/mholt/caddy-l4) for configuration examples.

            ## File Naming
            ```
            caddy_<version>_<os>_<arch>.tar.gz  (Linux/macOS/FreeBSD)
            caddy_<version>_<os>_<arch>.zip      (Windows)
            ```
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
